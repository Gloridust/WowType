name: CI

# PR 和推送到 main、pre-release：验证安装器、更新器及各发行版构建，安装包保存在 Artifacts。
# pre-release 是下一版的集成分支：功能 PR 先合进这里，攒够了再整体合进 main 发版。
# 只改了文档（*.md、docs/、截图）的提交不跑。
# 推送 v* 标签（git tag v0.1.0 && git push origin v0.1.0）：总是跑，并把这些包发到 GitHub Release。
# 其他分支想跑一次：Actions 页手动运行（workflow_dispatch）。

on:
  push:
    branches: [main, pre-release]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: 安装与更新回归
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: bash scripts/test-install.sh
      - run: python3 scripts/test-update.py
      - run: python3 scripts/test-shift-config.py
      # 设置契约：spec/ 自检 + 设置界面对照（fcitx5 插件在「插件」任务的 addon-test.sh 里对照，macOS 在 macos/test.sh 里）
      - run: python3 scripts/test-config-contract.py

  core:
    name: Rust 核心测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: 跨设备复制粘贴的中转服务（Cloudflare Worker 的代码，在 node 里跑）
        run: node --test relay/cloudflare/test/relay.test.mjs
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh
      - name: Windows 外壳里和平台无关的部分（组字、设置、语音键、自定义词、统计）在 Linux 上也测
        run: windows/test.sh

  relay:
    # 跨设备复制粘贴的中转服务（relay/cloudflare）在 Cloudflare 的本地运行时（wrangler dev 起的 workerd，
    # 真的 Durable Object）里走一遍接口。要从 npm 下 wrangler，不在 release 的 needs 里，挂了不挡发版。
    name: 中转服务（workerd）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 起 wrangler dev，对着它跑验收脚本
        working-directory: relay/cloudflare
        run: |
          echo 'TOKEN=ci-token' > .dev.vars
          WRANGLER_SEND_METRICS=false npx --yes wrangler@4 dev --port 8791 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for _ in $(seq 90); do curl -sf http://127.0.0.1:8791/ >/dev/null && break; sleep 1; done
          node test/live.mjs http://127.0.0.1:8791 ci-token || { cat wrangler.log; exit 1; }

  core-macos:
    # 核心和 C 接口在 macOS 上一直能编、能过测试。不在 release 的 needs 里，挂了不挡 Linux 发版。
    name: Rust 核心测试（macOS）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh

  windows:
    # Windows 输入法（windows/，TSF 文本服务，见 docs/WINDOWS.md）：核心在 Windows 上的测试、
    # 编 x64 的核心静态库和输入法 DLL、按键测试（小词库 + 真实词库）、设置契约、打 zip、
    # 用安装脚本真装一遍（regsvr32 注册、建一个文本服务对象）再卸载。
    # x64 的安装程序（WowType-<版本>-windows-x64-setup.exe）随发版进 Release（artifact 叫 pkg-windows-x64）。
    name: Windows 输入法（x64）
    needs: data
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: 核心测试
        run: cargo test -p wowtype-core --locked
      - name: 编核心静态库（带语音，静态 C 运行库）
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p wowtype-core --target-dir target/windows
      - name: 编输入法 DLL、按键测试、设置导出
        run: |
          cmake -S windows -B build/windows -A x64 -DWOWTYPE_CORE_LIB="$(pwd -W)/target/windows/release/wowtype_core.lib"
          cmake --build build/windows --config Release
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 代码签名（仓库配了证书才签）
        # 仓库的 Secrets 里放 WINDOWS_SIGNING_PFX（.pfx 的 base64）和 WINDOWS_SIGNING_PASSWORD 就会签 DLL、设置窗口，
        # 后面编完安装程序也签；没配就跳过（安装程序没签名，SmartScreen 会拦一下，见 docs/WINDOWS.md）
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX) { Write-Host '没配签名证书，跳过'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGN_PFX_PATH=$pfx" >> $env:GITHUB_ENV
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGN_PASSWORD `
            build/windows/Release/wowtype.dll build/windows/Release/wowtype-settings.exe
          if ($LASTEXITCODE -ne 0) { throw "签名失败：$LASTEXITCODE" }
      - name: 按键测试（和 macOS、fcitx5 的同名用例一样；小词库 + 真实词库）
        run: |
          build/windows/Release/wowtype-windows-harness.exe
          build/windows/Release/wowtype-windows-harness.exe dist/data/lexicon.tsv
      - name: 下载续传（设置窗口下模型、新版用的；配一个会掐断连接的服务器）
        shell: pwsh
        run: |
          $served = Join-Path $env:RUNNER_TEMP 'served.bin'
          $server = Start-Process python -ArgumentList 'windows/tests/range_server.py', '18765', "`"$served`"" -PassThru -NoNewWindow
          for ($i = 0; $i -lt 40 -and -not (Test-Path $served); $i++) { Start-Sleep -Milliseconds 250 }
          Start-Sleep -Seconds 1
          $want = (Get-FileHash $served -Algorithm SHA256).Hash.ToLower()
          $exe = (Resolve-Path build/windows/Release/wowtype-windows-download-test.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'download-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          try {
            # 一次下载里断了好几次：自动从断的地方接着下
            & $exe 'http://127.0.0.1:18765/flaky' (Join-Path $dir 'flaky.bin') $want
            if ($LASTEXITCODE -ne 0) { throw "断了几次没接上：$LASTEXITCODE" }
            # 服务器不认 Range：从头下
            & $exe 'http://127.0.0.1:18765/norange' (Join-Path $dir 'norange.bin') $want
            if ($LASTEXITCODE -ne 0) { throw "服务器不认 Range 时没从头下好：$LASTEXITCODE" }
            # 这一次下不完：留着 .part；再下一次从断的地方接着下完
            $broken = Join-Path $dir 'broken.bin'
            & $exe 'http://127.0.0.1:18765/broken' $broken $want
            if ($LASTEXITCODE -ne 1) { throw "第一次应该下不完：$LASTEXITCODE" }
            $part = (Get-Item "$broken.part").Length
            if ($part -le 0) { throw '没下完的部分没留着' }
            $out = & $exe 'http://127.0.0.1:18765/broken' $broken $want | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "第二次没下完：$LASTEXITCODE" }
            if ($out -notmatch "从 $part 开始") { throw "第二次不是从上次断的 $part 字节接着下的" }
            if (Test-Path "$broken.part") { throw '下完了 .part 还在' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 设置契约（spec/config.json）
        run: python scripts/test-config-contract.py --windows build/windows/Release/wowtype-windows-config-dump.exe
      - name: 打 zip
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export WOWTYPE_VERSION=${GITHUB_REF_NAME#v}; fi
          windows/package.sh dist/data build/windows/Release/wowtype.dll dist/windows
      - name: 用安装脚本装一遍、建一个文本服务对象、再卸载
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem dist/windows -Directory | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'WowType'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1" -Target $target
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 失败：$LASTEXITCODE" }
          $dll = Join-Path $target 'wowtype.dll'
          $clsid = 'HKLM:\SOFTWARE\Classes\CLSID\{A895B83F-8F60-4990-A48F-17821E3BC14A}'
          $server = (Get-ItemProperty "$clsid\InprocServer32").'(default)'
          if ($server -ne $dll) { throw "InprocServer32 不对：$server" }
          $tip = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{A895B83F-8F60-4990-A48F-17821E3BC14A}'
          if (-not (Test-Path $tip)) { throw '没注册到 TSF' }
          Get-ChildItem -Recurse $tip | Select-Object -ExpandProperty Name
          $link = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\WowType 设置.lnk'
          if (-not (Test-Path -LiteralPath $link)) { throw '开始菜单里没有「WowType 设置」' }
          # 类工厂和 QueryInterface：建一个文本服务对象（不激活）
          $service = [Activator]::CreateInstance([type]::GetTypeFromCLSID([guid]'A895B83F-8F60-4990-A48F-17821E3BC14A'))
          if ($null -eq $service) { throw '建不了文本服务对象' }
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($service)
          # 再装一遍（DLL 被这个进程载入着：旧的改名，新的照样装上）
          powershell -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1" -Target $target
          if ($LASTEXITCODE -ne 0) { throw "第二次 install.ps1 失败：$LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1" -Uninstall -Target $target
          if ($LASTEXITCODE -ne 0) { throw "卸载失败：$LASTEXITCODE" }
          if (Test-Path $clsid) { throw '卸载以后 CLSID 还在' }
          if (Test-Path -LiteralPath $link) { throw '卸载以后开始菜单里还有快捷方式' }
          if (Test-Path "$tip\LanguageProfile\0x00000804\{8106DB80-2DC6-4558-B368-86D26F78EC68}") { throw '卸载以后 TSF 里还有这个输入法' }
      - name: 编安装程序（Inno Setup）
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $pkg = (Get-ChildItem dist/windows -Directory -Filter '*-windows-x64').FullName
          $version = $pkg -replace '.*WowType-(.+)-windows-x64$', '$1'
          & $iscc /Q "/DAppVersion=$version" /DArch=x64 "/DSourceDir=$pkg" "/DOutputDir=$((Resolve-Path dist/windows).Path)" windows/installer/wowtype.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败：$LASTEXITCODE" }
          if ($env:SIGN_PFX_PATH) {
            & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:SIGN_PFX_PATH /p $env:SIGN_PASSWORD (Get-ChildItem dist/windows/*-x64-setup.exe).FullName
            if ($LASTEXITCODE -ne 0) { throw "签名失败：$LASTEXITCODE" }
          }
          Get-ChildItem dist/windows/*-setup.exe
      - name: 用安装程序装一遍、建一个文本服务对象、升级一遍、卸载
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/windows/*-x64-setup.exe).FullName
          $app = Join-Path $env:ProgramFiles 'WowType'
          $dll = Join-Path $app 'wowtype.dll'
          $clsid = 'HKLM:\SOFTWARE\Classes\CLSID\{A895B83F-8F60-4990-A48F-17821E3BC14A}'
          $tipProfile = 'HKLM:\SOFTWARE\Microsoft\CTF\TIP\{A895B83F-8F60-4990-A48F-17821E3BC14A}\LanguageProfile\0x00000804\{8106DB80-2DC6-4558-B368-86D26F78EC68}'
          $uninstallKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8AF92801-E722-42A0-A358-07EFD5436DF4}_is1'
          $link = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\WowType 设置.lnk'
          function Invoke-Setup([string]$log) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "安装程序失败：$($p.ExitCode)" }
          }
          Invoke-Setup "$env:RUNNER_TEMP\setup1.log"
          if ((Get-ItemProperty "$clsid\InprocServer32").'(default)' -ne $dll) { throw 'InprocServer32 不对' }
          if (-not (Test-Path $tipProfile)) { throw '没注册到 TSF' }
          if (-not (Test-Path -LiteralPath $link)) { throw '开始菜单里没有「WowType 设置」' }
          if (-not (Test-Path $uninstallKey)) { throw '「设置 → 应用」里没有卸载项' }
          if (-not (Test-Path (Join-Path $app 'data\lexicon.tsv'))) { throw '没装词库' }
          (Get-ItemProperty $uninstallKey).DisplayName
          # 端到端打字：开一个输入框，切到 WowType，用 SendInput 按真的键，看输入框里的字和候选框
          $typing = (Resolve-Path build/windows/Release/wowtype-windows-typing-test.exe).Path
          # 候选框、任务栏的截图（下面的 artifact 里看画得对不对）
          $env:WOWTYPE_SCREENSHOT_DIR = Join-Path $env:RUNNER_TEMP 'screenshots'
          New-Item -ItemType Directory -Force -Path $env:WOWTYPE_SCREENSHOT_DIR | Out-Null
          $p = Start-Process $typing -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Get-Content (Join-Path $env:LOCALAPPDATA 'WowType\wowtype.log') -Tail 200 -ErrorAction SilentlyContinue
            throw "打字测试有 $($p.ExitCode) 项没过"
          }
          # 两个进程（两个应用）之间的学习：B 开着，A 学到 shi 的第三个候选；B 不用重开，再打一次就是 A 学到的
          # 接着 A 用 Ctrl+退格忘掉它：B 也忘了；B 存过盘以后 A 再合并也不会回来
          $peer = Join-Path $env:RUNNER_TEMP 'peer'
          New-Item -ItemType Directory -Force -Path $peer | Out-Null
          $b = Start-Process $typing -ArgumentList '--peer-wait', "`"$peer`"" -PassThru -NoNewWindow
          for ($i = 0; $i -lt 240 -and -not (Test-Path (Join-Path $peer 'ready')); $i++) { Start-Sleep -Milliseconds 500 }
          $a = Start-Process $typing -ArgumentList '--peer-learn', "`"$peer`"" -PassThru -NoNewWindow
          $a.WaitForExit(); $b.WaitForExit()
          if ($a.ExitCode -ne 0 -or $b.ExitCode -ne 0) {
            Get-Content (Join-Path $env:LOCALAPPDATA 'WowType\wowtype.log') -Tail 300 -ErrorAction SilentlyContinue | Select-String -NotMatch 'vk='
            Get-Content (Join-Path $env:LOCALAPPDATA 'WowType\history.tsv') -ErrorAction SilentlyContinue | Select-String '时|是'
            throw "两个进程之间的学习没过（A $($a.ExitCode)，B $($b.ExitCode)）"
          }
          # 设置窗口几页的截图：先放一份假的打字统计，统计页的柱状图、热力图才有东西
          $days = [ordered]@{}
          for ($i = 29; $i -ge 0; $i--) {
            $d = (Get-Date).AddDays(-$i).ToString('yyyy-MM-dd')
            $n = 200 + (($i * 37) % 900)
            $days[$d] = @{ chars = $n; kinds = @{ han = [int]($n * 0.8); latin = [int]($n * 0.1) }; activeMs = 600000
                           keys = @{ KeyA = 40 + $i; KeyN = 90; KeyI = 70; KeyH = 60; KeyO = 50; Space = 120; Backspace = 30; KeyS = 20 } }
          }
          $statsDir = Join-Path $env:LOCALAPPDATA 'WowType'
          @{ version = 1; cleared = 0; days = $days } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $statsDir 'stats.json')
          Add-Type -AssemblyName System.Drawing
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool GetWindowRect(System.IntPtr h, out RECT r); public struct RECT { public int Left, Top, Right, Bottom; }'
          foreach ($page in '常规', '候选', '翻译', '自定义词', '统计') {
            $s = Start-Process (Join-Path $app 'wowtype-settings.exe') -ArgumentList '--page', $page -PassThru
            for ($i = 0; $i -lt 40 -and $s.MainWindowHandle -eq 0; $i++) { Start-Sleep -Milliseconds 250; $s.Refresh() }
            Start-Sleep 1
            $r = New-Object W.U+RECT
            [void][W.U]::GetWindowRect($s.MainWindowHandle, [ref]$r)
            if ($r.Right -gt $r.Left) {
              $bmp = New-Object System.Drawing.Bitmap ($r.Right - $r.Left), ($r.Bottom - $r.Top)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $bmp.Size)
              $bmp.Save((Join-Path $env:WOWTYPE_SCREENSHOT_DIR "settings-$page.png"))
              $g.Dispose(); $bmp.Dispose()
            }
            Stop-Process -Id $s.Id -Force
          }
          # 建一个文本服务对象：这个进程载入了 DLL，接着升级要能换掉它
          $service = [Activator]::CreateInstance([type]::GetTypeFromCLSID([guid]'A895B83F-8F60-4990-A48F-17821E3BC14A'))
          if ($null -eq $service) { throw '建不了文本服务对象' }
          Invoke-Setup "$env:RUNNER_TEMP\setup2.log"
          if (-not (Get-ChildItem $app -Filter 'wowtype.dll.old-*')) { throw '升级时被用着的旧 DLL 没改名换下来' }
          if ((Get-ItemProperty "$clsid\InprocServer32").'(default)' -ne $dll) { throw '升级以后 InprocServer32 不对' }
          [void][Runtime.InteropServices.Marshal]::ReleaseComObject($service)
          # 卸载程序会把自己拷到临时目录再跑：等卸载项没了
          Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $uninstallKey); $i++) { Start-Sleep 1 }
          if (Test-Path $uninstallKey) { throw '卸载以后卸载项还在' }
          if (Test-Path $clsid) { throw '卸载以后 CLSID 还在' }
          if (Test-Path $tipProfile) { throw '卸载以后 TSF 里还有这个输入法' }
          if (Test-Path -LiteralPath $link) { throw '卸载以后开始菜单里还有快捷方式' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # 候选框、任务栏输入指示器、设置窗口的截图（真打字的时候截的）
          name: windows-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 7
          if-no-files-found: ignore
      - name: ARM64：编核心和 DLL、打 zip（没有 ARM64 的 runner，只编不跑）
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --release --locked -p wowtype-core --target aarch64-pc-windows-msvc --target-dir target/windows
          cmake -S windows -B build/windows-arm64 -A ARM64 -DWOWTYPE_WINDOWS_TESTS=OFF \
            -DWOWTYPE_CORE_LIB="$(pwd -W)/target/windows/aarch64-pc-windows-msvc/release/wowtype_core.lib"
          cmake --build build/windows-arm64 --config Release
          WOWTYPE_WINDOWS_ARCH=arm64 windows/package.sh dist/data build/windows-arm64/Release/wowtype.dll dist/windows
      - name: ARM64：编安装程序（只编不装）
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $pkg = (Get-ChildItem dist/windows -Directory -Filter '*-windows-arm64').FullName
          $version = $pkg -replace '.*WowType-(.+)-windows-arm64$', '$1'
          & $iscc /Q "/DAppVersion=$version" /DArch=arm64 "/DSourceDir=$pkg" "/DOutputDir=$((Resolve-Path dist/windows).Path)" windows/installer/wowtype.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败：$LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          # 叫 pkg-*：发版任务按 pkg-* 收安装包（x64 的安装程序进 Release）
          name: pkg-windows-x64
          path: dist/windows/*-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          # 开发、试用：zip 解开以后以管理员身份运行 install.ps1（docs/WINDOWS.md）；ARM64 没有在真机上试过，不进 Release
          name: windows-x64
          path: dist/windows/*-x64.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            dist/windows/*-arm64.zip
            dist/windows/*-arm64-setup.exe
          retention-days: 7

  macos-app:
    # macOS 输入法外壳（macos/）：按键测试、打通用安装包、用安装包里的词库自检、真装一遍 pkg。
    # 发版时 WowType-<版本>-macos.pkg 跟 Linux 的包一起进 Release（artifact 叫 pkg-macos）。
    name: macOS 输入法
    needs: data
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试和设置契约（小词库 + 真实词库），外壳测试（真实词库）
        run: |
          macos/test.sh
          WOWTYPE_EXPECT_FULL_CHARS=1 macos/test.sh dist/data/lexicon.tsv dist/data/english.txt
      - name: 核心静态库要链接的系统库（对照 build.sh 的链接参数）
        run: |
          cargo rustc --release -q -p wowtype-core --lib --crate-type staticlib \
            --target-dir target/macos-libs -- --print native-static-libs 2>&1 | grep native-static-libs || true
      - name: 打包
        # 发版时版本号跟 tag 走（和 Linux 的包一样），一键安装脚本按 tag 找 WowType-<版本>-macos.pkg
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export WOWTYPE_VERSION=${GITHUB_REF_NAME#v}; fi
          macos/build.sh dist/data dist/macos
      - name: 检查安装包
        run: |
          app=dist/macos/WowType.app
          bin=$app/Contents/MacOS/WowType
          plutil -lint "$app/Contents/Info.plist"
          lipo "$bin" -verify_arch arm64 x86_64
          otool -L "$bin"
          # 只能链接系统自带的库
          # 通用二进制每个架构有一行「…(architecture arm64):」标题，跳过
          if otool -L "$bin" | grep -v ':$' | grep -Ev '^\s+(/System/Library/|/usr/lib/)'; then
            echo "链接了系统以外的库"; exit 1
          fi
          codesign --verify --strict "$app"
          unzip -l dist/macos/*.zip
          # 微信输入法的模型（nlrgpt2_nnlm.bin、wtlocal）不许带；nnlm.bin 是 WowType 自己训的，可以带（build.sh 只放它进来）
          if unzip -l dist/macos/*.zip | grep -Ei 'wtlocal|nlrgpt2|gguf|HY-MT|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
      - name: 自检（载入安装包里的词库打 nihao）
        run: WOWTYPE_DATA_DIR="$RUNNER_TEMP/wowtype-data" dist/macos/WowType.app/Contents/MacOS/WowType --selftest
      - name: 自检以后安装包没被改过（词库快照要写在数据目录，不能写进签过名的安装包）
        run: codesign --verify --strict dist/macos/WowType.app
      - name: 装一遍 pkg（只装给当前用户，不用 sudo）
        run: |
          pkg=$(ls dist/macos/WowType-*-macos.pkg)
          pkgutil --payload-files "$pkg" | grep -qx './WowType.app/Contents/MacOS/WowType'
          if pkgutil --payload-files "$pkg" | grep -Ei 'wtlocal|nlrgpt2|gguf|HY-MT|wetype'; then
            echo "pkg 里有不能分发的模型"; exit 1
          fi
          # 模拟从网上下载：带上隔离标记。安装器装出来的文件不能带，不然输入法跑不起来
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$pkg"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          app="$HOME/Library/Input Methods/WowType.app"
          codesign --verify --strict "$app"
          if xattr -r "$app" | grep -q com.apple.quarantine; then echo "装出来的文件带隔离标记"; exit 1; fi
          [[ -O "$app/Contents/MacOS/WowType" ]] || { echo "装出来的文件不归当前用户"; exit 1; }
          "$app/Contents/MacOS/WowType" --version
          xattr -d com.apple.quarantine "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          # 叫 pkg-*：发版任务按 pkg-* 收安装包
          name: pkg-macos
          path: dist/macos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          # zip 给 macos/install.sh 用（开发、测试），不进 Release
          name: macos-zip
          path: dist/macos/*.zip

  data:
    name: 词库（rime-ice）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-data.sh "" dist/data
      # 五笔 86 码表（rime-wubi，LGPL-3.0，钉死的提交）和许可证、作者、来源，和词库放在同一个目录
      - run: scripts/make-wubi.sh "" dist/data
      - name: Nix 包的词库版本
        # nix/package.nix 固定用某次发布页上的词库包。词库换了版本（rime-ice 更新或 REV 加一）时，
        # 新词库包要等这次发版后才有下载地址，所以这里只提醒；发版时 release job 会自动开 PR 改好（.github/scripts/nix-data-pr.sh）。
        run: |
          built=$(<dist/data/VERSION)
          pinned=$(sed -n 's/^ *dataVersion = "\(.*\)";/\1/p' nix/package.nix)
          if [ "$built" != "$pinned" ]; then
            echo "::warning title=Nix 词库版本落后::这次构建的词库是 $built，nix/package.nix 还固定在 $pinned。发版时会自动开 PR 更新。"
          fi
      - run: scripts/package-deb.sh data dist/data dist/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: dist/data
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-data
          path: dist/pkg

  # 可选的万象词库包（不进安装包，用户在设置里下载切换），随发布上传
  data-wanxiang:
    name: 词库（万象，可选）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-wanxiang.sh "" dist/wanxiang dist/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: data-wanxiang
          path: dist/wanxiang
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-data-wanxiang
          path: dist/pkg

  # 排序评测：用 data 任务的真实数据（rime-ice 词库 + words.lm + english.txt，两个外壳默认设置下的配置，
  # 不带神经语言模型）跑 tools/eval/ 下的全部用例。回归集 regress.tsv 必须全过；其余各组的 top1
  # （同音词组还有「通过」）比 tools/eval/baseline.tsv 低超过 0.5 个百分点就失败。汇总表在这次运行的 Summary 页。
  # 本地跑同一套、改了排序怎么更新基线：tools/eval/README.md。
  ranking-eval:
    name: 排序评测（真实词库）
    needs: data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 词库钉在基线记的 rime-ice 提交上
        # data 任务克隆的是 rime-ice 最新的提交。和基线记的不一样时，用基线那个提交重新生成词库
        # （words.lm 用 data 任务下载好的，不再下载），免得 rime-ice 一更新、排序没改也比不过基线
        run: |
          want=$(awk -F'\t' '$1 == "# 数据" { print $3 }' tools/eval/baseline.tsv)
          have=$(sed -n 's/^版本：\([0-9a-f]*\).*/\1/p' dist/data/SOURCE.txt)
          echo "基线的 rime-ice：${want:-没记}，data 任务的：${have:-不知道}"
          if [ -n "$want" ] && [ "$want" != "$have" ]; then
            git init -q "$RUNNER_TEMP/rime-ice"
            git -C "$RUNNER_TEMP/rime-ice" fetch -q --depth 1 https://github.com/iDvel/rime-ice.git "$want"
            git -C "$RUNNER_TEMP/rime-ice" checkout -q FETCH_HEAD
            # 评测不载入整句增强模型（eval.sh 只用 lexicon.tsv、words.lm、english.txt），不用再下载 nnlm.bin
            WOWTYPE_NO_NNLM=1 WOWTYPE_LM_FILE=dist/data/words.lm scripts/make-data.sh "$RUNNER_TEMP/rime-ice" dist/eval-data
            echo "EVAL_DATA=dist/eval-data" >> "$GITHUB_ENV"
          else
            echo "EVAL_DATA=dist/data" >> "$GITHUB_ENV"
          fi
      - name: 评测（回归集必须全过，其余各组和基线比）
        run: scripts/eval.sh "$EVAL_DATA"
      - name: 排序不变量（全部用例逐键打，一条都不许违反）
        # 「照着打的拼音不被纠错抢第一」「第一个音节的单字一直在」这类规则，见 docs/ENGINE-INVARIANTS.md。
        # 复用上一步编好的 wowtype-eval；不带神经语言模型（data 任务不下载 nnlm.bin），带模型的本地跑：
        # scripts/invariants.sh <数据目录> --nnlm <nnlm.bin>
        if: ${{ !cancelled() }}
        env:
          WOWTYPE_EVAL_BIN: target/release/wowtype-eval
        run: scripts/invariants.sh "$EVAL_DATA"

  addon:
    name: 插件 · ${{ matrix.distro }} · ${{ matrix.arch }}
    needs: [data, data-wanxiang]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [ubuntu22.04, ubuntu24.04, ubuntu26.04, debian13, deepin23, deepin25]
        include:
          - { distro: ubuntu22.04, image: "ubuntu:22.04" }
          - { distro: ubuntu24.04, image: "ubuntu:24.04" }
          - { distro: ubuntu26.04, image: "ubuntu:26.04" }
          - { distro: debian13, image: "debian:trixie" }
          - { distro: deepin23, image: "linuxdeepin/deepin:23" }
          - { distro: deepin25, image: "linuxdeepin/deepin:25" }
        exclude:
          # deepin 的容器镜像只有 amd64
          - { distro: deepin23, arch: arm64 }
          - { distro: deepin25, arch: arm64 }
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev libasound2-dev \
            fcitx5 fcitx5-modules \
            ca-certificates curl git dpkg-dev file python3 \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - uses: actions/download-artifact@v4
        if: matrix.distro == 'ubuntu26.04'
        with:
          name: data-wanxiang
          path: dist/wanxiang
      - name: 按键测试（万象词库）
        if: matrix.distro == 'ubuntu26.04'
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/wanxiang/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包
        run: WOWTYPE_DISTRO=${{ matrix.distro }} scripts/package-deb.sh engine "$VERSION" dist/pkg
      - name: 用一键安装脚本装上试一下
        run: |
          mkdir -p /tmp/inst && cp dist/pkg/wowtype_*.deb /tmp/inst/
          (cd /tmp/inst && sha256sum -- *.deb > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL=file:///tmp/inst WOWTYPE_YES=1 ./install.sh
          # fcitx5 没在跑：脚本直接把 WowType 写进 fcitx5 的输入法列表
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          ls /usr/lib/*/fcitx5/libwowtype.so
          # 词库和语言模型在安装包里
          test -s /usr/share/wowtype/words.lm && test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/wubi86.tsv dist/data/wubi86.tsv
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/wowtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/wowtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 跨设备复制粘贴的配对工具装上了、起得来
          wowtype-sync status --state /tmp/wowtype-sync-smoke.json | grep -q '"paired":false'
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee /tmp/show.txt
          grep -q '1\.你好' /tmp/show.txt
          # 设置界面：能 import GTK 4 / libadwaita，拼音整理逻辑正确
          wowtype-config --self-test
          # 图标装到 hicolor，输入法和设置界面都指向它
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
          # 插件清单要求编译时 fcitx5 的「主.次.0」（22.04 是 5.0.0），fcitx5 小版本落后一点的系统也能加载
          grep -qx "0=core:$(pkg-config --modversion Fcitx5Core | cut -d. -f1,2).0" /usr/share/fcitx5/addon/wowtype.conf
      - name: 设置界面：每页、每个对话框点一遍（无头；22.04 的老 libadwaita 用替身控件）
        run: timeout 300 dbus-run-session -- xvfb-run -a python3 scripts/test-settings-gui.py /usr/bin/wowtype-config
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/pkg

  arch:
    name: 插件 · archlinux
    needs: data
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # rust 包自带 cargo；fcitx5 包含 CMake 配置和按键测试用的 testim 插件。
        # makepkg 不替我们装依赖：包的 depends（fcitx5-gtk、fcitx5-qt、python-gobject、gtk4、libadwaita）这里都要装上。
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            fcitx5 fcitx5-gtk fcitx5-qt alsa-lib rust pkgconf python git ca-certificates util-linux \
            python-gobject gtk4 libadwaita curl
          useradd --create-home builder
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 makepkg 打 pacman 包（普通用户、从源码重建）
        run: |
          install -d -o builder -g builder dist/pkg
          runuser -u builder -- scripts/package-arch.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Arch 包
        run: |
          # archlinux 容器的 pacman.conf 用 NoExtract 跳过了 /usr/share/doc 等，
          # 不去掉的话 pacman -Qkk 会把没解出来的文档当成文件缺失
          sed -i '/^NoExtract/d' /etc/pacman.conf
          (cd dist/pkg && sha256sum -- *.pkg.tar.zst > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          pacman -Qip dist/pkg/wowtype-*.pkg.tar.zst
          pacman -Qkk wowtype
          test -f /usr/lib/fcitx5/libwowtype.so
          ldd /usr/lib/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          cmp /usr/share/wowtype/wubi86.tsv dist/data/wubi86.tsv
          test -s /usr/share/licenses/wowtype/LICENSE.rime-wubi
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/wowtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/wowtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 跨设备复制粘贴的配对工具装上了、起得来
          wowtype-sync status --state /tmp/wowtype-sync-smoke.json | grep -q '"paired":false'
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-archlinux
          path: dist/pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: 插件 · fedora${{ matrix.version }} · ${{ matrix.arch }}
    needs: data
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [43, 44, 45]
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # fcitx5-devel 带 CMake 配置；fcitx5 带按键测试用的 testim 插件。
        # 设置界面也在安装后测试，故装好 GTK / PyGObject（包本身把它们列为推荐依赖）。
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo cmake extra-cmake-modules gcc-c++ pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-lib-devel rpm-build \
            python3 python3-gobject gtk4 libadwaita gobject-introspection \
            git ca-certificates findutils file which curl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 rpmbuild 打 rpm 包（从源码重建）
        run: scripts/package-rpm.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Fedora 包
        run: |
          # fedora 容器的 dnf 默认 tsflags=nodocs，去掉免得 rpm -V 把没装的文档当成缺失
          sed -i '/^tsflags=nodocs/d' /etc/dnf/dnf.conf
          (cd dist/pkg && sha256sum -- *.rpm > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          rpm -qip dist/pkg/wowtype-*.rpm
          rpm -V wowtype
          # Fedora 的 fcitx5 插件目录是 /usr/lib64/fcitx5
          test "$(pkg-config --variable=libdir Fcitx5Core)/fcitx5" = /usr/lib64/fcitx5
          test -f /usr/lib64/fcitx5/libwowtype.so
          ldd /usr/lib64/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          cmp /usr/share/wowtype/wubi86.tsv dist/data/wubi86.tsv
          test -s /usr/share/licenses/wowtype/LICENSE.rime-wubi
          # 整句增强模型：data 任务下载到了 nnlm.bin 就必须装上、和它一样；微信输入法的模型永远不许带
          if [ -f dist/data/nnlm.bin ]; then cmp /usr/share/wowtype/nnlm.bin dist/data/nnlm.bin; fi
          if find /usr/share/wowtype | grep -Ei 'nlrgpt2|wtlocal|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 跨设备复制粘贴的配对工具装上了、起得来
          wowtype-sync status --state /tmp/wowtype-sync-smoke.json | grep -q '"paired":false'
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          # fcitx5 没在跑：直接把 WowType 写进 fcitx5 的输入法列表
          wowtype-config --add-to-group
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fedora${{ matrix.version }}-${{ matrix.arch }}
          path: dist/pkg/*.rpm
          if-no-files-found: error

  opensuse:
    # 走 install.sh 的 openSUSE 路径：zypper 装编译依赖、解开源码包、用词库包编译安装、加进输入法列表。
    # 源码包是这次提交的 git archive（发版时是 tag 的源码），词库包是 data 任务打的那个。
    name: 源码安装 · openSUSE Tumbleweed
    needs: data
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout 和 install.sh 自己要的工具
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends git ca-certificates curl tar gzip file findutils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-data
          path: dist/assets
      - name: install.sh（本地源码包和词库包）
        run: |
          git config --global --add safe.directory "$PWD"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml)
          git archive --prefix="WowType-$version/" -o dist/source.tar.gz HEAD
          (cd dist/assets && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          bash install.sh --print-plan
          WOWTYPE_YES=1 WOWTYPE_VERSION="v$version" WOWTYPE_BASE_URL="file://$PWD/dist/assets" \
            WOWTYPE_SOURCE_URL="file://$PWD/dist/source.tar.gz" bash install.sh
          # fcitx5 没在跑：wowtype-config --setup 直接写进 fcitx5 的输入法列表
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
      - name: 插件路径、依赖、真实词库和设置界面
        run: |
          addon_dir="$(pkg-config --variable=libdir Fcitx5Core)/fcitx5"
          test -f "$addon_dir/libwowtype.so"
          ldd "$addon_dir/libwowtype.so" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then exit 1; fi
          test -f /usr/share/fcitx5/addon/wowtype.conf
          test -f /usr/share/fcitx5/inputmethod/wowtype.conf
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 跨设备复制粘贴的配对工具装上了、起得来
          wowtype-sync status --state /tmp/wowtype-sync-smoke.json | grep -q '"paired":false'
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test

  nix:
    # flake.lock 固定的是 nixos-unstable；用户一般用 inputs.nixpkgs.follows 跟自己系统的 nixpkgs，
    # 所以稳定版也要能编。新稳定版出来（每年 5 月、11 月）时把 nixos-26.05 换成新的。
    name: Nix · ${{ matrix.nixpkgs }} · ${{ matrix.system }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nixpkgs: nixos-unstable, system: x86_64-linux }
          - { nixpkgs: nixos-unstable, system: aarch64-linux }
          - { nixpkgs: nixos-26.05, system: x86_64-linux }
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # 构建插件（词库按 flake 里固定的哈希从发布页下载），再跑 checks：
      # 自检工具用装好的词库打出「你好」、设置界面自测
      - name: 构建并检查
        env:
          NIXPKGS: ${{ matrix.nixpkgs }}
        run: |
          override=()
          if [ "$NIXPKGS" != nixos-unstable ]; then
            override=(--override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS")
          fi
          nix build .#default -L "${override[@]}"
          nix flake check -L "${override[@]}"

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, core, data, data-wanxiang, addon, arch, fedora, nix, macos-app, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 正式版还是预发布
        # tag 打在 main 上的提交 → 正式版（成为 Latest，所有人的检查更新和一键安装都会拿到）；
        # 打在别处（比如 pre-release 分支）→ GitHub 的 pre-release：检查更新和 install.sh 只认 releases/latest，
        # 不会推给普通用户，要装得写 WOWTYPE_VERSION。测完转正：合进 main 后
        # gh release edit <tag> --prerelease=false --latest（release 分支、Nix 词库 PR 这时手动补，见 docs/INSTALL.md）。
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "PRERELEASE=" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=1" >> "$GITHUB_ENV"
            echo "::notice title=预发布::$GITHUB_REF_NAME 不在 main 上，发成 pre-release"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: 校验和
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 「这一版要注意」只写给下一个版本，发完这一版就删掉这一节
          cat > notes.md <<EOF
          ## 这一版要注意

          - 升级以后要重启一次输入法才用上新版：设置界面会提醒，点「重启」就行（一键安装脚本也会问）。GNOME 上更新后要注销重新登录一次，才会载入新的扩展。
          - 新功能「开发者模式」（默认关，调候选排序用）：打开以后把每次打的拼音、光标前的上文、当时候选框里的候选、选了第几个、怎么选的（空格、数字键、鼠标），还有打到一半放弃的、上屏后马上退格的，明文记在本机数据目录的 devlog.jsonl 里。在设置「常规 → 开发者」（Windows 是「输入」页最后一项）打开，打开前会弹窗说明；记录只有自己能读、不上传，「导出日志」也不带它，旁边能导出、清空。密码框里不记，但终端的 sudo 提示这类没标成密码框的地方，中文模式下打的会被记下来，打密码前先关掉或切英文。记录的格式和汇总、转评测用例的 tools/devlog.py 见 docs/DEVLOG.md（#325）。

          ## 安装（Ubuntu / Debian、deepin、Arch Linux、Fedora、NixOS）

          一行命令（下载对应发行版的安装包、装好、加进 fcitx5 输入法列表）：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者手动下载和你系统对应的一个 \`wowtype_<版本>_<发行版>_<架构>.deb\`（词库已经在包里），然后 \`sudo apt install ./wowtype_*.deb\`。
          Ubuntu / Debian 的 deb 和 Fedora RPM 有 x86_64（amd64）和 arm64（aarch64）两种，一键脚本按本机架构选；Arch 包和 deepin 包只有 x86_64。
          Arch Linux / EndeavourOS / Garuda / CachyOS：一键脚本用 pacman 安装对应包，不替你整机升级；依赖装不上时按提示先运行 \`sudo pacman -Syu\`。
          Fedora 43 / 44 / 45：自动选择与系统版本一致的 RPM。Debian 13、Ubuntu 22.04 / 24.04 / 26.04 及明确声明兼容基线的衍生版、deepin 23 / 25 使用对应 deb。
          Manjaro：按安装说明在本机用 makepkg 打包；openSUSE Tumbleweed：同一行命令会问过后用 zypper 装编译依赖，在本机从源码编译安装。
          NixOS（x86_64、aarch64）：flake 输入写 \`github:${GITHUB_REPOSITORY}/release\`（跟正式版）或 \`github:${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}\`（锁这一版），把 \`inputs.wowtype.packages.<system>.default\` 加进 \`i18n.inputMethod.fcitx5.addons\`，见[安装说明](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md#nixos--nix)。
          完整步骤见 [README](https://github.com/${GITHUB_REPOSITORY}#安装)。

          ## 安装（macOS 12 以上，Apple 芯片和 Intel）

          在「终端」里运行同一行命令（推荐）：下载 \`WowType-${GITHUB_REF_NAME#v}-macos.pkg\`、校验后只装给当前用户，不要管理员密码，也不用到「隐私与安全性」里放行，装完自动切到 WowType。

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者下载 \`WowType-${GITHUB_REF_NAME#v}-macos.pkg\` 双击安装。安装包没有 Apple 开发者签名：第一次打开时系统会说无法验证，点「完成」，再到「系统设置 → 隐私与安全性」往下找到 WowType，点「仍要打开」。

          ## 安装（Windows 10 1803 以上 / Windows 11，x64，预览版）

          下载 \`WowType-${GITHUB_REF_NAME#v}-windows-x64-setup.exe\` 双击安装（会问一次管理员权限），装好后按 \`Win + 空格\` 切到 WowType。
          安装程序没有代码签名：Windows 提示「Windows 已保护你的电脑」时点「更多信息」→「仍要运行」。
          输入行为和 Linux、macOS 是同一份，但 Windows 版还没在很多电脑、很多应用上试过；设置窗口「常规」页的「复制诊断信息」贴进 issue 就好。
          还没有的（检查更新、代码签名等）见 [docs/WINDOWS.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/WINDOWS.md)。

          安装包里的词库来自 [rime-ice](https://github.com/iDvel/rime-ice)（GPL-3.0），词频另用了 [Tatoeba](https://tatoeba.org) 的中文句子（CC BY 2.0 FR）统计，词级语言模型 words.lm 和整句增强模型 nnlm.bin 是 CC BY-SA 4.0；详见安装包里的 DATA-SOURCE.txt。
          五笔 86 码表 wubi86.tsv 来自 [rime-wubi](https://github.com/rime/rime-wubi)（LGPL-3.0），作者和钉死的提交见随包的 WUBI-AUTHORS、WUBI-SOURCE.txt。

          可选词库：\`wowtype-data-wanxiang-*.tar.gz\` 是从[万象拼音](https://github.com/amzxyz/rime_wanxiang)（CC BY 4.0）转换的词库，不在安装包里。
          想用的话在「WowType 设置 → 输入 → 词库」里选「万象拼音」并下载，或运行 \`wowtype-config --install-lexicon wanxiang\`；随时可以切回默认的雾凇。

          EOF
          # 「这一版要注意」单独传一份（RELEASE-NOTES.md）：各端检查更新从这里取更新说明，不用问 GitHub 接口
          #（不登录时每个 IP 每小时只能问 60 次）。不进 SHA256SUMS，各端按名字直接下
          awk '/^## 这一版要注意/{on=1} on && /^## / && !/^## 这一版要注意/{exit} on' notes.md > dist/RELEASE-NOTES.md
          grep -q '^## 这一版要注意' dist/RELEASE-NOTES.md
          extra=()
          if [ -n "$PRERELEASE" ]; then
            extra=(--prerelease --latest=false)
            { printf '> **预发布，测试用。** 检查更新和一键安装不会装它；要装就在一键命令前加 `WOWTYPE_VERSION=%s`：\n>\n' "$GITHUB_REF_NAME"
              printf '> ```bash\n> curl -fsSL https://raw.githubusercontent.com/%s/%s/install.sh | WOWTYPE_VERSION=%s bash\n> ```\n\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME"
              cat notes.md; } > notes.pre && mv notes.pre notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WowType $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${extra[@]}"
      - name: 通知 Telegram 群
        # GITHUB_TOKEN 发的 release 不会触发 telegram-notify.yml，所以在这里直接发。
        # 没配置 TELEGRAM_CHAT_ID 就跳过；发送失败也不算发版失败。
        if: vars.TELEGRAM_CHAT_ID != '' && env.PRERELEASE == ''
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: release
          R_TAG: ${{ github.ref_name }}
        run: node .github/scripts/tg-notify.mjs
      - name: 更新 release 分支（NixOS 用户跟这个分支拿正式版）
        # GITHUB_TOKEN 不能把分支移到改过 .github/workflows 的提交上；两次发版之间改过 CI，就要
        # RELEASE_BRANCH_TOKEN（细粒度 PAT：Contents、Workflows 读写）。没配置或失败只提醒，不算发版失败。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BRANCH_TOKEN || github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME 不是最新版（最新是 $latest），release 分支不动"
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/release" > /dev/null 2>&1; then
            ok=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true -q .object.sha || true)
          else
            ok=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$sha" -q .object.sha || true)
          fi
          if [ "$ok" != "$sha" ]; then
            echo "::warning title=release 分支没更新::在本机运行 git push --force origin $GITHUB_REF_NAME^{commit}:refs/heads/release，或配置 RELEASE_BRANCH_TOKEN（见 docs/INSTALL.md）"
            exit 1
          fi
          echo "release 分支 → $GITHUB_REF_NAME（$sha）"
      - name: Nix 词库跟上这一版
        # 这一版换了词库，就把 nix/package.nix 改好开 PR 到 main（开不了 PR 时退回开 issue），见脚本开头
        if: env.PRERELEASE == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/nix-data-pr.sh dist/wowtype-data-rime-ice-*.tar.gz
