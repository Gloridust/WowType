name: CI

# PR 和推送到 main、pre-release：验证安装器、更新器及各发行版构建，安装包保存在 Artifacts。
# pre-release 是下一版的集成分支：功能 PR 先合进这里，攒够了再整体合进 main 发版。
# 只改了文档（*.md、docs/、截图）的提交不跑。
# 推送 v* 标签（git tag v0.1.0 && git push origin v0.1.0）：总是跑，并把这些包发到 GitHub Release。
# 其他分支想跑一次：Actions 页手动运行（workflow_dispatch）。

on:
  push:
    branches: [main, pre-release]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: 安装与更新回归
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: bash scripts/test-install.sh
      - run: python3 scripts/test-update.py
      - run: python3 scripts/test-shift-config.py

  core:
    name: Rust 核心测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh

  core-macos:
    # 核心和 C 接口在 macOS 上一直能编、能过测试。不在 release 的 needs 里，挂了不挡 Linux 发版。
    name: Rust 核心测试（macOS）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh

  macos-app:
    # macOS 输入法外壳（macos/）：按键测试、打通用安装包、用安装包里的词库自检、真装一遍 pkg。
    # 发版时 WowType-<版本>-macos.pkg 跟 Linux 的包一起进 Release（artifact 叫 pkg-macos）。
    name: macOS 输入法
    needs: data
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（小词库 + 真实词库）
        run: |
          macos/test.sh
          WOWTYPE_EXPECT_FULL_CHARS=1 macos/test.sh dist/data/lexicon.tsv dist/data/english.txt
      - name: 核心静态库要链接的系统库（对照 build.sh 的链接参数）
        run: |
          cargo rustc --release -q -p wowtype-core --no-default-features --lib --crate-type staticlib \
            --target-dir target/macos-libs -- --print native-static-libs 2>&1 | grep native-static-libs || true
      - name: 打包
        run: macos/build.sh dist/data dist/macos
      - name: 检查安装包
        run: |
          app=dist/macos/WowType.app
          bin=$app/Contents/MacOS/WowType
          plutil -lint "$app/Contents/Info.plist"
          lipo "$bin" -verify_arch arm64 x86_64
          otool -L "$bin"
          # 只能链接系统自带的库
          # 通用二进制每个架构有一行「…(architecture arm64):」标题，跳过
          if otool -L "$bin" | grep -v ':$' | grep -Ev '^\s+(/System/Library/|/usr/lib/)'; then
            echo "链接了系统以外的库"; exit 1
          fi
          codesign --verify --strict "$app"
          unzip -l dist/macos/*.zip
          if unzip -l dist/macos/*.zip | grep -Ei 'wtlocal|nnlm|gguf|HY-MT|wetype'; then
            echo "安装包里有不能分发的模型"; exit 1
          fi
      - name: 自检（载入安装包里的词库打 nihao）
        run: WOWTYPE_DATA_DIR="$RUNNER_TEMP/wowtype-data" dist/macos/WowType.app/Contents/MacOS/WowType --selftest
      - name: 自检以后安装包没被改过（词库快照要写在数据目录，不能写进签过名的安装包）
        run: codesign --verify --strict dist/macos/WowType.app
      - name: 装一遍 pkg（只装给当前用户，不用 sudo）
        run: |
          pkg=$(ls dist/macos/WowType-*-macos.pkg)
          pkgutil --payload-files "$pkg" | grep -qx './WowType.app/Contents/MacOS/WowType'
          if pkgutil --payload-files "$pkg" | grep -Ei 'wtlocal|nnlm|gguf|HY-MT|wetype'; then
            echo "pkg 里有不能分发的模型"; exit 1
          fi
          # 模拟从网上下载：带上隔离标记。安装器装出来的文件不能带，不然输入法跑不起来
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$pkg"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          app="$HOME/Library/Input Methods/WowType.app"
          codesign --verify --strict "$app"
          if xattr -r "$app" | grep -q com.apple.quarantine; then echo "装出来的文件带隔离标记"; exit 1; fi
          [[ -O "$app/Contents/MacOS/WowType" ]] || { echo "装出来的文件不归当前用户"; exit 1; }
          "$app/Contents/MacOS/WowType" --version
          xattr -d com.apple.quarantine "$pkg"
      - uses: actions/upload-artifact@v4
        with:
          # 叫 pkg-*：发版任务按 pkg-* 收安装包
          name: pkg-macos
          path: dist/macos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          # zip 给 macos/install.sh 用（开发、测试），不进 Release
          name: macos-zip
          path: dist/macos/*.zip

  data:
    name: 词库（rime-ice）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-data.sh "" dist/data
      - name: Nix 包的词库版本
        # nix/package.nix 固定用某次发布页上的词库包。词库换了版本（rime-ice 更新或 REV 加一）时，
        # 新词库包要等这次发版后才有下载地址，所以这里只提醒；发版时 release job 会开 issue 写好要改的内容。
        run: |
          built=$(<dist/data/VERSION)
          pinned=$(sed -n 's/^ *dataVersion = "\(.*\)";/\1/p' nix/package.nix)
          if [ "$built" != "$pinned" ]; then
            echo "::warning title=Nix 词库版本落后::这次构建的词库是 $built，nix/package.nix 还固定在 $pinned。发版后按自动开的 issue 更新。"
          fi
      - run: scripts/package-deb.sh data dist/data dist/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: dist/data
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-data
          path: dist/pkg

  # 可选的万象词库包（不进安装包，用户在设置里下载切换），随发布上传
  data-wanxiang:
    name: 词库（万象，可选）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-wanxiang.sh "" dist/wanxiang dist/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: data-wanxiang
          path: dist/wanxiang
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-data-wanxiang
          path: dist/pkg

  addon:
    name: 插件 · ${{ matrix.distro }} · ${{ matrix.arch }}
    needs: [data, data-wanxiang]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [ubuntu24.04, ubuntu26.04, debian13]
        include:
          - { distro: ubuntu24.04, image: "ubuntu:24.04" }
          - { distro: ubuntu26.04, image: "ubuntu:26.04" }
          - { distro: debian13, image: "debian:trixie" }
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev libasound2-dev \
            fcitx5 fcitx5-modules \
            ca-certificates curl git dpkg-dev file python3 \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - uses: actions/download-artifact@v4
        if: matrix.distro == 'ubuntu26.04'
        with:
          name: data-wanxiang
          path: dist/wanxiang
      - name: 按键测试（万象词库）
        if: matrix.distro == 'ubuntu26.04'
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/wanxiang/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包
        run: scripts/package-deb.sh engine "$VERSION" dist/pkg
      - name: 用一键安装脚本装上试一下
        run: |
          mkdir -p /tmp/inst && cp dist/pkg/wowtype_*.deb /tmp/inst/
          (cd /tmp/inst && sha256sum -- *.deb > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL=file:///tmp/inst WOWTYPE_YES=1 ./install.sh
          # fcitx5 没在跑：脚本直接把 WowType 写进 fcitx5 的输入法列表
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          ls /usr/lib/*/fcitx5/libwowtype.so
          # 词库和语言模型在安装包里
          test -s /usr/share/wowtype/words.lm && test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee /tmp/show.txt
          grep -q '1\.你好' /tmp/show.txt
          # 设置界面：能 import GTK 4 / libadwaita，拼音整理逻辑正确
          wowtype-config --self-test
          # 图标装到 hicolor，输入法和设置界面都指向它
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/pkg

  arch:
    name: 插件 · archlinux
    needs: data
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # rust 包自带 cargo；fcitx5 包含 CMake 配置和按键测试用的 testim 插件。
        # 设置界面也在安装后测试，故装好 GTK / PyGObject（包本身把它们列为可选依赖）。
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            fcitx5 alsa-lib rust pkgconf python git ca-certificates util-linux \
            python-gobject gtk4 libadwaita curl
          useradd --create-home builder
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 makepkg 打 pacman 包（普通用户、从源码重建）
        run: |
          install -d -o builder -g builder dist/pkg
          runuser -u builder -- scripts/package-arch.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Arch 包
        run: |
          # archlinux 容器的 pacman.conf 用 NoExtract 跳过了 /usr/share/doc 等，
          # 不去掉的话 pacman -Qkk 会把没解出来的文档当成文件缺失
          sed -i '/^NoExtract/d' /etc/pacman.conf
          (cd dist/pkg && sha256sum -- *.pkg.tar.zst > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          pacman -Qip dist/pkg/wowtype-*.pkg.tar.zst
          pacman -Qkk wowtype
          test -f /usr/lib/fcitx5/libwowtype.so
          ldd /usr/lib/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-archlinux
          path: dist/pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: 插件 · fedora${{ matrix.version }} · ${{ matrix.arch }}
    needs: data
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [43, 44, 45]
        arch: [x86_64, aarch64]
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # fcitx5-devel 带 CMake 配置；fcitx5 带按键测试用的 testim 插件。
        # 设置界面也在安装后测试，故装好 GTK / PyGObject（包本身把它们列为推荐依赖）。
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo cmake extra-cmake-modules gcc-c++ pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-lib-devel rpm-build \
            python3 python3-gobject gtk4 libadwaita gobject-introspection \
            git ca-certificates findutils file which curl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 rpmbuild 打 rpm 包（从源码重建）
        run: scripts/package-rpm.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Fedora 包
        run: |
          # fedora 容器的 dnf 默认 tsflags=nodocs，去掉免得 rpm -V 把没装的文档当成缺失
          sed -i '/^tsflags=nodocs/d' /etc/dnf/dnf.conf
          (cd dist/pkg && sha256sum -- *.rpm > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          rpm -qip dist/pkg/wowtype-*.rpm
          rpm -V wowtype
          # Fedora 的 fcitx5 插件目录是 /usr/lib64/fcitx5
          test "$(pkg-config --variable=libdir Fcitx5Core)/fcitx5" = /usr/lib64/fcitx5
          test -f /usr/lib64/fcitx5/libwowtype.so
          ldd /usr/lib64/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          # fcitx5 没在跑：直接把 WowType 写进 fcitx5 的输入法列表
          wowtype-config --add-to-group
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fedora${{ matrix.version }}-${{ matrix.arch }}
          path: dist/pkg/*.rpm
          if-no-files-found: error

  opensuse:
    name: 源码安装 · openSUSE Tumbleweed
    needs: data
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            rust cargo gcc-c++ make cmake extra-cmake-modules pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-devel python3 python3-gobject python3-gobject-Gdk \
            typelib-1_0-Gtk-4_0 typelib-1_0-Adw-1 git ca-certificates file findutils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 编译并安装到系统 Fcitx 目录
        run: |
          cargo build --release --locked -p wowtype-core
          cmake -S fcitx5-addon -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          install -m755 target/release/wowtype-check target/release/wowtype-show /usr/bin/
          install -m644 dist/data/lexicon.tsv dist/data/english.txt dist/data/words.lm /usr/share/wowtype/
      - name: 插件路径、依赖、真实词库和设置界面
        run: |
          addon_dir="$(pkg-config --variable=libdir Fcitx5Core)/fcitx5"
          test -f "$addon_dir/libwowtype.so"
          ldd "$addon_dir/libwowtype.so" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then exit 1; fi
          test -f /usr/share/fcitx5/addon/wowtype.conf
          test -f /usr/share/fcitx5/inputmethod/wowtype.conf
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test

  nix:
    # flake.lock 固定的是 nixos-unstable；用户一般用 inputs.nixpkgs.follows 跟自己系统的 nixpkgs，
    # 所以稳定版也要能编。新稳定版出来（每年 5 月、11 月）时把 nixos-26.05 换成新的。
    name: Nix · ${{ matrix.nixpkgs }} · ${{ matrix.system }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nixpkgs: nixos-unstable, system: x86_64-linux }
          - { nixpkgs: nixos-unstable, system: aarch64-linux }
          - { nixpkgs: nixos-26.05, system: x86_64-linux }
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # 构建插件（词库按 flake 里固定的哈希从发布页下载），再跑 checks：
      # 自检工具用装好的词库打出「你好」、设置界面自测
      - name: 构建并检查
        env:
          NIXPKGS: ${{ matrix.nixpkgs }}
        run: |
          override=()
          if [ "$NIXPKGS" != nixos-unstable ]; then
            override=(--override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS")
          fi
          nix build .#default -L "${override[@]}"
          nix flake check -L "${override[@]}"

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, core, data, data-wanxiang, addon, arch, fedora, nix, macos-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: 校验和
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## 安装（Ubuntu / Debian、Arch Linux、Fedora、NixOS）

          一行命令（下载对应发行版的安装包、装好、加进 fcitx5 输入法列表）：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者手动下载和你系统对应的一个 \`wowtype_<版本>_<发行版>_<架构>.deb\`（词库已经在包里），然后 \`sudo apt install ./wowtype_*.deb\`。
          deb 和 Fedora RPM 有 x86_64（amd64）和 arm64（aarch64）两种，一键脚本按本机架构选；Arch 包只有 x86_64。
          Arch Linux / EndeavourOS / Garuda / CachyOS：一键脚本用 pacman 安装对应包，不替你整机升级；依赖装不上时按提示先运行 \`sudo pacman -Syu\`。
          Fedora 43 / 44 / 45：自动选择与系统版本一致的 RPM。Debian 13、Ubuntu 24.04 / 26.04 及明确声明兼容基线的衍生版使用对应 deb。
          Manjaro：按安装说明在本机用 makepkg 打包；openSUSE Tumbleweed：按安装说明从源码构建。
          NixOS（x86_64、aarch64）：flake 输入写 \`github:${GITHUB_REPOSITORY}/release\`（跟正式版）或 \`github:${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}\`（锁这一版），把 \`inputs.wowtype.packages.<system>.default\` 加进 \`i18n.inputMethod.fcitx5.addons\`，见[安装说明](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md#nixos--nix)。
          完整步骤见 [README](https://github.com/${GITHUB_REPOSITORY}#安装)。

          ## 安装（macOS 12 以上，Apple 芯片和 Intel）

          在「终端」里运行同一行命令（推荐）：下载 \`WowType-${GITHUB_REF_NAME#v}-macos.pkg\`、校验后只装给当前用户，不要管理员密码，也不用到「隐私与安全性」里放行，装完自动切到 WowType。

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者下载 \`WowType-${GITHUB_REF_NAME#v}-macos.pkg\` 双击安装。安装包没有 Apple 开发者签名：第一次打开时系统会说无法验证，点「完成」，再到「系统设置 → 隐私与安全性」往下找到 WowType，点「仍要打开」。

          安装包里的词库来自 [rime-ice](https://github.com/iDvel/rime-ice)（GPL-3.0），词级语言模型 words.lm 是 CC BY-SA 4.0。

          可选词库：\`wowtype-data-wanxiang-*.tar.gz\` 是从[万象拼音](https://github.com/amzxyz/rime_wanxiang)（CC BY 4.0）转换的词库，不在安装包里。
          想用的话在「WowType 设置 → 输入 → 词库」里选「万象拼音」并下载，或运行 \`wowtype-config --install-lexicon wanxiang\`；随时可以切回默认的雾凇。

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WowType $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
      - name: 通知 Telegram 群
        # GITHUB_TOKEN 发的 release 不会触发 telegram-notify.yml，所以在这里直接发。
        # 没配置 TELEGRAM_CHAT_ID 就跳过；发送失败也不算发版失败。
        if: vars.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: release
          R_TAG: ${{ github.ref_name }}
        run: node .github/scripts/tg-notify.mjs
      - name: 更新 release 分支（NixOS 用户跟这个分支拿正式版）
        # GITHUB_TOKEN 不能把分支移到改过 .github/workflows 的提交上；两次发版之间改过 CI，就要
        # RELEASE_BRANCH_TOKEN（细粒度 PAT：Contents、Workflows 读写）。没配置或失败只提醒，不算发版失败。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BRANCH_TOKEN || github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME 不是最新版（最新是 $latest），release 分支不动"
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/release" > /dev/null 2>&1; then
            ok=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true -q .object.sha || true)
          else
            ok=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$sha" -q .object.sha || true)
          fi
          if [ "$ok" != "$sha" ]; then
            echo "::warning title=release 分支没更新::在本机运行 git push --force origin $GITHUB_REF_NAME^{commit}:refs/heads/release，或配置 RELEASE_BRANCH_TOKEN（见 docs/INSTALL.md）"
            exit 1
          fi
          echo "release 分支 → $GITHUB_REF_NAME（$sha）"
      - name: Nix 词库跟上这一版
        # nix/package.nix 固定用某次发布页上的词库包；这一版换了词库，就开 issue 写好要改的三行
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball=$(cd dist && ls wowtype-data-rime-ice-*.tar.gz)
          built=${tarball#wowtype-data-rime-ice-}
          built=${built%.tar.gz}
          pinned=$(sed -n 's/^ *dataVersion = "\(.*\)";/\1/p' nix/package.nix)
          if [ "$built" = "$pinned" ]; then
            echo "Nix 包的词库已经是 $built"
            exit 0
          fi
          hex=$(sha256sum "dist/$tarball" | cut -d' ' -f1)
          sri=$(python3 -c 'import base64, sys; print("sha256-" + base64.b64encode(bytes.fromhex(sys.argv[1])).decode())' "$hex")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$tarball"
          cat > issue.md <<EOF
          $GITHUB_REF_NAME 的词库是 \`$built\`，nix/package.nix 还固定在 \`$pinned\`，NixOS 用户拿到的是旧词库。

          把 nix/package.nix 里这三处改成：

          \`\`\`nix
          dataVersion = "$built";
          url = "$url";
          hash = "$sri";
          \`\`\`

          合进 main 后，跟 release 分支的 NixOS 用户在下一次发版时拿到新词库。
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Nix 包的词库更新到 $built" --body-file issue.md
