<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font:13px -apple-system,"PingFang SC",sans-serif;line-height:1.55}code{font:12px ui-monospace,Menlo,monospace}</style></head><body>
<p><b>装好了。</b>菜单栏的输入法里选 WowType 就能打字；单按 Shift 切中英文。</p>
<p>菜单栏里没看到 WowType 的话：打开「系统设置 → 键盘 → 输入法 → 编辑」，点左下角的 +，在「简体中文」里选 WowType 添加。还是没有就注销重新登录一次。</p>
<p>设置：切到 WowType 后，点菜单栏的输入法图标，在菜单里找 WowType 的设置项。</p>
</body></html>
